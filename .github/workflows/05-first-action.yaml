name: 05-first-action

on:
    workflow_dispatch:

jobs:
    checkout:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
    
    install-node:
        runs-on: ubuntu-latest
        needs: checkout
        steps:
            - uses: actions/setup-node@v4
              with:
                node-version: '22'