name : execution flow
on:
    workflow_dispatch:
        inputs:
            pass_unit_test:
                type: boolean
                default: false


jobs:
    lint-build:
        runs-on: ubuntu-latest
        steps:
            - name: lint and build
              run: echo "Linting and building the application..."

    unit-test:
        runs-on: ubuntu-latest
        steps:
            - name: run unit tests
              run: echo "Running unit tests..."
            - name : fail unit test
              if: ${{ github.event.inputs.pass_unit_test == 'false' }}
              run: exit 1
    deploy-non-prod:
        runs-on: ubuntu-latest
        needs: 
            - lint-build 
            - unit-test
        steps:
            - name: deploy to non-prod
              run: echo "Deploying to non-production environment..."

    e2e-tests:
        runs-on: ubuntu-latest
        needs: deploy-non-prod
        steps:
            - name: run end-to-end tests
              run: echo "Running end-to-end tests..."

    load-tests:
        runs-on: ubuntu-latest
        needs: deploy-non-prod
        steps:
            - name: Running load tests
              run: echo "Running load tests"

    deploy-prod:
        runs-on: ubuntu-latest
        needs:
            - e2e-tests
            - load-tests
        steps:
            - name: Deploying to prod
              run: echo "Deploying to prod..."