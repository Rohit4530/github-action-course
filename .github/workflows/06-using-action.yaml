name: 06-using-action
on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
    deploy:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/setup-node@v4
              with:
                node-version: '22'
            - run: npm install
        working-directory: react-app
            - run: npm start
        working-directory: react-app
